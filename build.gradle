plugins {
    id 'java-library'
    id 'org.openjfx.javafxplugin'
}

ext.moduleName = 'qupath.extension.wsinsight'
// Resolve the QuPath version from either:
//   * the standalone settings.gradle (sets `gradle.ext.qupathVersion`), or
//   * the QuPath monorepo settings.gradle.kts (sets `gradle.ext['qupath.app.version']`).
ext.qupathVersion = gradle.ext.has('qupathVersion')
        ? gradle.ext.qupathVersion
        : gradle.ext['qupath.app.version']

base {
    description = 'QuPath extension providing a GUI wrapper around the WSInsight Docker image'
    version = '0.1.0'
    group = 'io.github.qupath'
}

javafx {
    version = libs.versions.javafx.get()
    modules = ['javafx.base', 'javafx.controls', 'javafx.graphics', 'javafx.fxml']
}

compileJava.options.encoding = 'UTF-8'
compileTestJava.options.encoding = 'UTF-8'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
    withSourcesJar()
    withJavadocJar()
}

dependencies {
    // QuPath is provided at runtime by the host application; compile-only here.
    compileOnly "io.github.qupath:qupath-gui-fx:${qupathVersion}"
    compileOnly "io.github.qupath:qupath-core:${qupathVersion}"
    compileOnly "io.github.qupath:qupath-core-processing:${qupathVersion}"
    compileOnly libs.qupath.fxtras
    compileOnly libs.slf4j

    testImplementation libs.junit
    testRuntimeOnly libs.junit.platform
    testRuntimeOnly libs.slf4j
    testRuntimeOnly libs.gson
}

processResources {
    from("${projectDir}/LICENSE") {
        into 'META-INF/licenses/'
    }
}

// Relax Javadoc strictness unless -PstrictJavadoc=true (matches QuPath's convention).
def strictJavadoc = findProperty('strictJavadoc')
if (!strictJavadoc) {
    tasks.withType(Javadoc) {
        options.addStringOption('Xdoclint:none', '-quiet')
    }
}

jar {
    manifest {
        attributes(
                'Implementation-Title': project.name,
                'Implementation-Version': archiveVersion,
                'Automatic-Module-Name': moduleName
        )
    }
}

tasks.named('test') {
    useJUnitPlatform()
}

// The CLI schema is no longer bundled: `wsinsight describe --output <path>`
// writes it and the extension reads that file at runtime, so there is no second
// copy here to keep in sync or verify.

